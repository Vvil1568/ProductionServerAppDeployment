apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.4
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-storage
              mountPath: /usr/share/nginx/html
          env:
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-auth
                  key: TOKEN
      volumes:
        - name: html-storage
          configMap:
            name: web-page